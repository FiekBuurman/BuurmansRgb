<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>buurmansRgb – Lampen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#7FB0FF}a:hover{color:#A9C9FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #16161A; color: #F4F1EA; font-family: 'Bricolage Grotesque', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 24px 20px 12px 20px">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="38" height="38" viewBox="0 0 220 220" aria-hidden="true">
        <rect width="220" height="220" rx="50" fill="#24242B"></rect>
        <path d="M98 152 L98 196" stroke="#F4F1EA" stroke-width="10" stroke-linecap="round"></path>
        <path d="M122 152 L122 170 L134 178 L130 198" fill="none" stroke="#F4F1EA" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="M80 140 L80 82 A30 30 0 0 1 100 54 L100 140 Z" fill="#FF3B3B"></path>
        <rect x="100" y="52" width="20" height="88" fill="#1FC46A"></rect>
        <path d="M120 54 A30 30 0 0 1 140 82 L140 140 L120 140 Z" fill="#2F6BFF"></path>
        <path d="M80 140 L80 82 A30 30 0 0 1 140 82 L140 140 Z" fill="none" stroke="#F4F1EA" stroke-width="10" stroke-linejoin="round"></path>
        <rect x="70" y="138" width="80" height="16" rx="4" fill="#24242B" stroke="#F4F1EA" stroke-width="10"></rect>
        <g transform="rotate(-16 110 108)">
          <rect x="50" y="92" width="120" height="32" rx="16" fill="#E8BE96" stroke="#1A1A1A" stroke-width="9"></rect>
          <rect x="94" y="99" width="32" height="18" rx="3" fill="#F7E6D3"></rect>
        </g>
      </svg>
      <div style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em">buurmans<span style="color: #FF5A5A">R</span><span style="color: #3DDC84">g</span><span style="color: #5B93FF">b</span></div>
    </div>
    <button aria-label="Instellingen" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2E2E36; background: #212128; color: #F4F1EA; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"></path></svg>
    </button>
  </header>

  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 4px 20px 0 20px">

    <section style="background: #212128; border: 1px solid #2E2E36; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <div>
          <div style="font-size: 13px; color: #A9A6A0">Hele huis</div>
          <div style="font-size: 26px; font-weight: 800; letter-spacing: -0.02em">3 van 4 aan</div>
        </div>
        <button aria-pressed="true" aria-label="Alles aan of uit" style="width: 60px; height: 36px; border-radius: 18px; border: 0; background: #F4F1EA; padding: 4px; display: flex; justify-content: flex-end; cursor: pointer">
          <span style="width: 28px; height: 28px; border-radius: 14px; background: #16161A; display: block"></span>
        </button>
      </div>
      <div aria-hidden="true" style="display: flex; justify-content: space-between; padding: 6px 4px">
        <sc-for list="{{strip}}" as="d" hint-placeholder-count="14">
          <span style="width: 12px; height: 12px; border-radius: 6px; background: {{d.c}}; box-shadow: 0 0 10px 2px {{d.c}}; display: block"></span>
        </sc-for>
      </div>
    </section>

    <div style="display: flex; justify-content: space-between; align-items: baseline; padding-top: 4px">
      <h2 style="margin: 0; font-size: 18px; font-weight: 600">Lampen in huis</h2>
      <a href="#" style="font-size: 14px; text-decoration: none">+ Erbij knutselen</a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{lamps}}" as="l" hint-placeholder-count="4">
        <div style="background: #212128; border: 1px solid #2E2E36; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
          <span aria-hidden="true" style="width: 38px; height: 38px; border-radius: 19px; background: {{l.c}}; box-shadow: {{l.glow}}; flex-shrink: 0; display: block"></span>
          <div style="flex-grow: 1; min-width: 0">
            <div style="font-size: 16px; font-weight: 600">{{l.name}}</div>
            <div style="font-size: 13px; color: #A9A6A0">{{l.sub}}</div>
          </div>
          <button aria-pressed="{{l.on}}" aria-label="{{l.name}} aan of uit" style="width: 52px; height: 32px; border-radius: 16px; border: 0; padding: 4px; background: {{l.track}}; display: flex; justify-content: {{l.justify}}; cursor: pointer; flex-shrink: 0">
            <span style="width: 24px; height: 24px; border-radius: 12px; background: {{l.knob}}; display: block"></span>
          </button>
        </div>
      </sc-for>
    </div>

    <section style="background: #1C2433; border: 1px solid #2B3B57; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true" style="flex-shrink: 0">
        <path d="M3 20 L11 12 L19 20 L21 20 L29 12 L37 20" fill="none" stroke="#A9C9FF" stroke-width="2" stroke-linejoin="round"></path>
        <rect x="6" y="20" width="10" height="12" fill="none" stroke="#A9C9FF" stroke-width="2"></rect>
        <rect x="24" y="20" width="10" height="12" fill="none" stroke="#A9C9FF" stroke-width="2"></rect>
        <path d="M16 24 Q20 20 24 24" fill="none" stroke="#5B93FF" stroke-width="2" stroke-dasharray="2 2"></path>
      </svg>
      <div style="flex-grow: 1">
        <div style="font-size: 15px; font-weight: 600">Buurman is online</div>
        <div style="font-size: 13px; color: #A9B8D4">Zet jullie lampen in dezelfde kleur</div>
      </div>
      <button style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: #5B93FF; color: #0E1420; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Samen</button>
    </section>
  </main>

  <nav aria-label="Hoofdmenu" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 10px 8px 22px 8px; border-top: 1px solid #2E2E36; background: #1A1A1F; margin-top: 16px">
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; justify-content: center; color: #F4F1EA; text-decoration: none; font-size: 12px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"></path></svg>Lampen</a>
    <a href="Kleur.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; justify-content: center; color: #A9A6A0; text-decoration: none; font-size: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>Kleur</a>
    <a href="Scenes.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; justify-content: center; color: #A9A6A0; text-decoration: none; font-size: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>Scènes</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; justify-content: center; color: #A9A6A0; text-decoration: none; font-size: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M2 12l5-5 5 5 5-5 5 5"></path><path d="M4 12v8h6v-8M14 12v8h6v-8"></path></svg>Buren</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pal = ['#FF5A5A','#FF9A3D','#FFD84D','#3DDC84','#3DD6D0','#5B93FF','#A97BFF'];
    const strip = [];
    for (let i = 0; i < 14; i++) strip.push({ c: pal[i % pal.length] });
    const mk = (name, sub, c, on) => ({
      name, sub, c: on ? c : '#3A3A42', on: on ? 'true' : 'false',
      glow: on ? '0 0 16px 2px ' + c : 'none',
      track: on ? c : '#3A3A42',
      knob: on ? '#16161A' : '#8C8A85',
      justify: on ? 'flex-end' : 'flex-start'
    });
    return {
      strip,
      lamps: [
        mk('Ledstrip woonkamer', 'Woonkamer · 80%', '#FF9A3D', true),
        mk('Werkbank', 'Schuur · fel wit', '#F4F1EA', true),
        mk('Onder de trap', 'Gang · 40%', '#A97BFF', true),
        mk('Tuinhuisje', 'Tuin · uit', '#3DDC84', false)
      ]
    };
  }
}
</script>
</body>
</html>
