<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>buurmansRgb – Kleur mengen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#7FB0FF}a:hover{color:#A9C9FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #16161A; color: #F4F1EA; font-family: 'Bricolage Grotesque', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 8px; padding: 24px 20px 8px 12px">
    <a href="Main.dc.html" aria-label="Terug naar lampen" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F4F1EA">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div>
      <h1 style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em">Kleur mengen</h1>
      <div style="font-size: 13px; color: #A9A6A0">Ledstrip woonkamer</div>
    </div>
  </header>

  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px; padding: 8px 20px 0 20px">

    <section aria-label="Voorbeeld" style="background: #0E0E11; border: 1px solid #2E2E36; border-radius: 22px; padding: 26px 18px 20px 18px; display: flex; flex-direction: column; gap: 22px">
      <div aria-hidden="true" style="background: #26262D; border-radius: 8px; height: 22px; padding: 0 10px; display: flex; align-items: center; justify-content: space-between">
        <sc-for list="{{dots}}" as="d" hint-placeholder-count="12">
          <span style="width: 12px; height: 12px; border-radius: 6px; background: {{color}}; box-shadow: 0 0 14px 4px {{color}}; display: block"></span>
        </sc-for>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: flex-end">
        <div>
          <div style="font-size: 13px; color: #A9A6A0">Huidige kleur</div>
          <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 30px">{{hex}}</div>
        </div>
        <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; color: #A9A6A0">{{rgbText}}</div>
      </div>
    </section>

    <div style="display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between"><label for="r" style="font-size: 15px; font-weight: 600">Rood</label><span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14px; color: #A9A6A0">{{r}}</span></div>
        <input id="r" type="range" min="0" max="255" value="{{r}}" onChange="{{onR}}" style="width: 100%; height: 28px; accent-color: #FF5A5A; margin: 0">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between"><label for="g" style="font-size: 15px; font-weight: 600">Groen</label><span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14px; color: #A9A6A0">{{g}}</span></div>
        <input id="g" type="range" min="0" max="255" value="{{g}}" onChange="{{onG}}" style="width: 100%; height: 28px; accent-color: #3DDC84; margin: 0">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between"><label for="b" style="font-size: 15px; font-weight: 600">Blauw</label><span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14px; color: #A9A6A0">{{b}}</span></div>
        <input id="b" type="range" min="0" max="255" value="{{b}}" onChange="{{onB}}" style="width: 100%; height: 28px; accent-color: #5B93FF; margin: 0">
      </div>
    </div>

    <div>
      <div style="font-size: 13px; color: #A9A6A0; margin-bottom: 10px">Uit de gereedschapskist</div>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{presets}}" as="p" hint-placeholder-count="6">
          <button aria-label="{{p.name}}" onClick="{{p.pick}}" style="height: 44px; border-radius: 12px; border: {{p.border}}; background: {{p.c}}; cursor: pointer"></button>
        </sc-for>
      </div>
    </div>

    <button style="min-height: 52px; border-radius: 26px; border: 0; background: #F4F1EA; color: #16161A; font-family: inherit; font-size: 17px; font-weight: 800; cursor: pointer; margin-top: 2px">Op de strip zetten</button>
  </main>

  <nav aria-label="Hoofdmenu" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 10px 8px 22px 8px; border-top: 1px solid #2E2E36; background: #1A1A1F; margin-top: 16px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; justify-content: center; color: #A9A6A0; text-decoration: none; font-size: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"></path></svg>Lampen</a>
    <a href="Kleur.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; justify-content: center; color: #F4F1EA; text-decoration: none; font-size: 12px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>Kleur</a>
    <a href="Scenes.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; justify-content: center; color: #A9A6A0; text-decoration: none; font-size: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>Scènes</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; justify-content: center; color: #A9A6A0; text-decoration: none; font-size: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M2 12l5-5 5 5 5-5 5 5"></path><path d="M4 12v8h6v-8M14 12v8h6v-8"></path></svg>Buren</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { r: 255, g: 154, b: 61 };
  }
  renderVals() {
    const { r, g, b } = this.state;
    const h = (n) => n.toString(16).padStart(2, '0').toUpperCase();
    const color = 'rgb(' + r + ',' + g + ',' + b + ')';
    const dots = [];
    for (let i = 0; i < 12; i++) dots.push({ i });
    const list = [
      ['Klus-wit', 255, 244, 229], ['Rood', 255, 59, 59], ['Oranje', 255, 154, 61],
      ['Groen', 31, 196, 106], ['Blauw', 47, 107, 255], ['Paars', 169, 123, 255]
    ];
    const presets = list.map(([name, pr, pg, pb]) => {
      const sel = pr === r && pg === g && pb === b;
      return {
        name, c: 'rgb(' + pr + ',' + pg + ',' + pb + ')',
        border: sel ? '3px solid #F4F1EA' : '1px solid #2E2E36',
        pick: () => this.setState({ r: pr, g: pg, b: pb })
      };
    });
    return {
      r, g, b, color, dots, presets,
      hex: '#' + h(r) + h(g) + h(b),
      rgbText: r + ' · ' + g + ' · ' + b,
      onR: (e) => this.setState({ r: Number(e.target.value) }),
      onG: (e) => this.setState({ g: Number(e.target.value) }),
      onB: (e) => this.setState({ b: Number(e.target.value) })
    };
  }
}
</script>
</body>
</html>
